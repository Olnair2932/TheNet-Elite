<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00ff41">
    <meta name="description" content="TheNet Elite - Terminal Hacker do Mestre Olnair">
    
    <!-- PWA Primary Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icons/icon-512.png">
    <link rel="manifest" href="manifest.json">
    
    <title>TheNet Elite v4.3.2</title>
    
    <!-- CSS Estilizado Neon -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDKs (Núcleo e Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Fundo Matrix Dinâmico -->
    <canvas id="matrix"></canvas>

    <div class="hud">
        <header>
            <h1>THENET <small>v4.3.2</small></h1>
        </header>

        <!-- Barra de Status do Sistema -->
        <div class="stats-bar">
            <div class="stat">T: <b id="timer">00:00</b></div>
            <div class="stat">M: <b id="tries">0</b></div>
            <div class="stat">B: <b id="record">--</b></div>
        </div>

        <!-- Grade de Hackeamento (Jogo) -->
        <main class="grid" id="grid"></main>
        
        <!-- Arena Global: Leaderboard -->
        <section id="leaderboard" class="leaderboard-area">
            <h3>TOP 5 SENTINELAS</h3>
            <ul id="ranking-list">
                <li><span class="loading">Sincronizando com a rede...</span></li>
            </ul>
        </section>

        <!-- Painel de Controle -->
        <div class="btn-group">
            <button class="cmd-btn" onclick="location.reload()" aria-label="Reiniciar Protocolo">REINICIAR</button>
            <button class="cmd-btn" onclick="shareAccess()" aria-label="Compartilhar Acesso">COMPARTILHAR</button>
        </div>

        <!-- Assinatura do Arquiteto -->
        <footer class="footer-credits">
            DESENVOLVEDOR MESTRE: OLNAIR GONZAGA PEREIRA<br>
            <small>olnairpereira@gmail.com | ALIANÇA GEMINI 🛡️</small>
        </footer>
    </div>

    <!-- Motor Lógico do Sistema -->
    <script src="js/app.js"></script>

    <!-- Registro do Service Worker (PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Sentinela PWA: Ativado', reg.scope))
                    .catch(err => console.log('Falha no PWA:', err));
            });
        }
    </script>
</body>
</html>
